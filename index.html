        }
        100% {
          transform: translate(30%, 30%) rotate(35deg);
        }
      }

        }

        }

        animation: marquee 30s linear infinite;

  <script>
    // Initialize Vimeo player after React renders
    var _vimeoPlayer = null;
    var _vimeoMuted = true;

    function initVimeoPlayer() {
      var el = document.getElementById('vimeo-player');
      if (!el || !window.Vimeo) {
        setTimeout(initVimeoPlayer, 300);
        return;
      }
      _vimeoPlayer = new Vimeo.Player(el);
    }

    window.toggleVimeoSound = function() {
      if (!_vimeoPlayer) return;
      if (_vimeoMuted) {
        _vimeoPlayer.setMuted(false);
        var btn = document.getElementById('sound-btn');
        if (btn) btn.innerHTML = '🔊 Som ativado';
        _vimeoMuted = false;
      } else {
        _vimeoPlayer.setMuted(true);
        var btn = document.getElementById('sound-btn');
        if (btn) btn.innerHTML = '🔇 Toque para ouvir';
        _vimeoMuted = true;
      }
    };

    // Wait for React to mount before initializing
    window.addEventListener('load', function() {
      setTimeout(initVimeoPlayer, 800);
    });
  </script>
